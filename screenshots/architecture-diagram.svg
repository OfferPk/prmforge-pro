  <rect width="960" height="540" fill="url(#bg)"/>

  <text x="480" y="46" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" letter-spacing="1">PRMFORGE PRO (v1.0.0) — SYSTEM ARCHITECTURE</text>
