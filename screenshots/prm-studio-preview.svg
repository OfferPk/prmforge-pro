<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <rect width="960" height="540" fill="#0b1324"/>
  <!-- Top Bar -->
  <rect x="0" y="0" width="960" height="50" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <circle cx="30" cy="25" r="8" fill="#38bdf8"/>
  <text x="50" y="31" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">PRMForge Pro</text>
  <text x="175" y="31" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">v1.0.0</text>
  <text x="230" y="31" fill="#64748b" font-family="system-ui, sans-serif" font-size="12">CCSDS 507.0-B-1 Pointing Request &amp; Observation Studio</text>
  <rect x="840" y="12" width="95" height="26" rx="4" fill="#059669"/>
  <text x="887" y="29" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">10/10 PASS</text>

  <!-- Left Column: 3D Celestial Sphere & KPIs -->
  <rect x="20" y="70" width="440" height="445" rx="8" fill="#131f37" stroke="#1e293b" stroke-width="1"/>
  <text x="35" y="98" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">3D CELESTIAL SPHERE &amp; SUN EXCLUSION CONE</text>

  <!-- 3D Canvas Box -->
  <rect x="35" y="112" width="410" height="230" rx="6" fill="#040812" stroke="#1e293b"/>
  <!-- Celestial Sphere Outline -->
  <circle cx="240" cy="227" r="90" fill="none" stroke="#334155" stroke-width="1.5"/>
  <ellipse cx="240" cy="227" rx="90" ry="32" fill="none" stroke="#1e293b" stroke-width="1"/>
  <ellipse cx="240" cy="227" rx="32" ry="90" fill="none" stroke="#1e293b" stroke-width="1"/>

  <!-- Spacecraft at Center -->
  <circle cx="240" cy="227" r="6" fill="#10b981"/>
  <text x="250" y="238" fill="#94a3b8" font-size="9" font-family="sans-serif">SENTINEL-2C</text>

  <!-- Target Pointing Vector (Cyan) -->
  <line x1="240" y1="227" x2="185" y2="160" stroke="#38bdf8" stroke-width="2"/>
  <circle cx="185" cy="160" r="5" fill="#38bdf8"/>
  <text x="120" y="155" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">SINDH SITE</text>

  <!-- Sun Vector & Avoidance Cone (Amber) -->
  <line x1="240" y1="227" x2="310" y2="180" stroke="rgba(245, 158, 11, 0.4)" stroke-width="1" stroke-dasharray="3,3"/>
  <circle cx="310" cy="180" r="38" fill="rgba(245, 158, 11, 0.12)" stroke="rgba(245, 158, 11, 0.5)" stroke-dasharray="3,3"/>
  <circle cx="310" cy="180" r="7" fill="#f59e0b"/>
  <text x="322" y="184" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">Sun (45° Cone)</text>

  <!-- KPIs Grid -->
  <rect x="35" y="355" width="195" height="42" rx="4" fill="#0f172a"/>
  <text x="45" y="370" fill="#94a3b8" font-size="9" font-family="sans-serif">TARGET COORDINATES</text>
  <text x="45" y="388" fill="#38bdf8" font-size="12" font-family="monospace" font-weight="bold">RA: 145.2°, Dec: +12.8°</text>

  <rect x="250" y="355" width="195" height="42" rx="4" fill="#0f172a"/>
  <text x="260" y="370" fill="#94a3b8" font-size="9" font-family="sans-serif">SUN EXCLUSION SEPARATION</text>
  <text x="260" y="388" fill="#10b981" font-size="12" font-family="monospace" font-weight="bold">68.4° (Margin: +23.4°)</text>

  <rect x="35" y="405" width="195" height="42" rx="4" fill="#0f172a"/>
  <text x="45" y="420" fill="#94a3b8" font-size="9" font-family="sans-serif">OBSERVATION DURATION</text>
  <text x="45" y="438" fill="#fff" font-size="12" font-family="monospace" font-weight="bold">600.0 s (10.0 min)</text>

  <rect x="250" y="405" width="195" height="42" rx="4" fill="#0f172a"/>
  <text x="260" y="420" fill="#94a3b8" font-size="9" font-family="sans-serif">SLEW TIME &amp; ACCELERATION</text>
  <text x="260" y="438" fill="#f59e0b" font-size="12" font-family="monospace" font-weight="bold">32.4 s (Trapezoidal)</text>

  <!-- Right Column: PRM KVN Output -->
  <rect x="480" y="70" width="460" height="445" rx="8" fill="#131f37" stroke="#1e293b" stroke-width="1"/>
  <text x="500" y="98" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">CCSDS 507.0-B-1 POINTING REQUEST MESSAGE (KVN)</text>

  <rect x="500" y="112" width="420" height="385" rx="6" fill="#050914" stroke="#1e293b"/>
  <text x="515" y="136" fill="#64748b" font-family="monospace" font-size="11">CCSDS_PRM_VERS = 1.0</text>
  <text x="515" y="152" fill="#64748b" font-family="monospace" font-size="11">CREATION_DATE  = 2026-10-17T09:15:00.000Z</text>
  <text x="515" y="168" fill="#64748b" font-family="monospace" font-size="11">ORIGINATOR     = PRMFORGE_PRO_SOC</text>
  <text x="515" y="184" fill="#64748b" font-family="monospace" font-size="11">MESSAGE_ID     = REQ-OBS-2026-001</text>
  <text x="515" y="206" fill="#38bdf8" font-family="monospace" font-size="11">OBJECT_NAME    = SENTINEL-2C</text>
  <text x="515" y="222" fill="#38bdf8" font-family="monospace" font-size="11">START_TIME     = 2026-10-17T09:15:00.000Z</text>
  <text x="515" y="238" fill="#38bdf8" font-family="monospace" font-size="11">STOP_TIME      = 2026-10-17T09:25:00.000Z</text>
  <text x="515" y="260" fill="#cbd5e1" font-family="monospace" font-size="11">REQUEST_TYPE   = SURFACE_TARGET</text>
  <text x="515" y="276" fill="#cbd5e1" font-family="monospace" font-size="11">TARGET_NAME    = SINDH_CALIBRATION_SITE</text>
  <text x="515" y="292" fill="#cbd5e1" font-family="monospace" font-size="11">RIGHT_ASCENSION= 145.2000 [deg]</text>
  <text x="515" y="308" fill="#cbd5e1" font-family="monospace" font-size="11">DECLINATION    = 12.8000 [deg]</text>
  <text x="515" y="330" fill="#a5b4fc" font-family="monospace" font-size="11">BORESIGHT_VECTOR_Z    = 1.000000</text>
  <text x="515" y="346" fill="#f59e0b" font-family="monospace" font-size="11">PHASE_CONSTRAINT_TYPE = SUN_POINTING</text>
  <text x="515" y="362" fill="#10b981" font-family="monospace" font-size="11">SUN_EXCLUSION_ANGLE   = 45.00 [deg]</text>
  <text x="515" y="378" fill="#a5b4fc" font-family="monospace" font-size="11">MAX_SLEW_RATE         = 2.500 [deg/s]</text>
  <text x="515" y="405" fill="#10b981" font-family="monospace" font-size="11">[10/10 PASS] NORMATIVE SCORECARD CERTIFIED</text>
</svg>
